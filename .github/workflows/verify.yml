name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            # Node 24 bundles the macOS fetch crash described in nodejs/undici#5544.
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Use a canonical macOS temporary directory
        if: runner.os == 'macOS'
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'TMPDIR=' + require('node:fs').realpathSync(require('node:os').tmpdir()) + '\n')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck with Rust compiler
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Select test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Unit and integration tests
        run: node scripts/run-unit-tests.mjs

      - name: Systemd test harness cleanup
        run: node --test scripts/viewer-systemd-cleanup.test.mjs

      - name: Skill CLI resolution
        run: node --test scripts/skill-cli-resolution.test.mjs scripts/skill-cli-windows.test.mjs

      - name: Pinned npm skill fallback
        run: node scripts/skill-cli-package-smoke.mjs

      - name: Install browser
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Browser tests
        run: node scripts/run-browser-tests.mjs

      - name: Package smoke test
        run: node scripts/package-smoke.mjs

      - name: Website integrity
        run: node scripts/verify-site.mjs && node --test scripts/site-theme.test.mjs
