<script>
  const button = document.createElement("button");
  button.textContent = "Increment runtime";
  const counter = document.createElement("output");
  counter.id = "counter";
  counter.textContent = "0";
  button.addEventListener("click", () => { counter.textContent = String(Number(counter.textContent) + 1); });
  document.body.append(button, counter);
  window.addEventListener("message", (event) => {
    if (event.data?.type === "html-inbox:appearance") document.documentElement.dataset.bridgeTheme = event.data.theme;
  });
</script>
</body>
