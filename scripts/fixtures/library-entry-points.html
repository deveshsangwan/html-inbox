<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Library entry points</title>
  <script src="{{TAILWIND_ENTRY_POINT}}"></script>
</head>
<body>
  <p id="tailwind-result" class="p-4 font-bold">Tailwind entry point</p>
  <pre class="mermaid">graph TD; Stored-->Rendered;</pre>
  <p id="mermaid-result">loading</p>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
      await mermaid.run({ querySelector: '.mermaid' });
      document.querySelector('#mermaid-result').textContent = 'rendered';
    } catch (error) {
      document.querySelector('#mermaid-result').textContent = 'failed: ' + error.message;
    }
  </script>
</body>
</html>
